name: Restore index.html
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index.html from git history
        run: |
          git show 9b0df64:mashhoor-personal-portfolio.html > index.html
          ls -l index.html
          git config user.name "mashhoor-toon"
          git config user.email "billahok77@gmail.com"
          git add index.html
          git commit -m "Restore site content as index.html"
          git push
